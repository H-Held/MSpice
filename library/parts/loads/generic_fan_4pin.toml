format_version = "0.1"

[part]
id = "generic_fan_4pin"
name = "4-pin PWM PC fan, 12 V"
version = "0.1.0"
category = "load/fan"
description = """
12 V PC fan with PWM speed control and tachometer output (4-pin connector:
gnd, +12 V, tach, pwm).

- PWM input: pulled up inside the fan, so an open input means full speed.
  The duty cycle is measured with a first-order filter (t_duty_filter).
- Supply current and speed follow the curves in data/generic_fan_4pin.csv
  (current and speed against duty cycle), scaled linearly with the supply
  voltage relative to v_nominal.
- Speed follows its target with the time constant t_spinup (rotor inertia).
- Feature `inrush`: extra current while the rotor is slower than its target,
  i_inrush at standstill, falling to zero at target speed.
- Tach output: open drain, pulses_per_rev pulses per revolution.

The interface follows the public 4-wire PWM fan specification; current,
speed and time constants are author estimates for a typical 120 mm fan."""
author = "The MSpice Authors"
license = "CC-BY-4.0"
quality = "draft"
tags = ["fan", "motor", "pwm", "tachometer"]

[part.source]
kind = "standard"
title = "4-Wire Pulse Width Modulation (PWM) Controlled Fans"
vendor = "Intel"
revision = "1.3"
section = "PWM control input; tachometer output signal"
notes = "Interface behaviour only (internal pull-up on PWM, 25 kHz PWM, open-collector tach with 2 pulses per revolution). Current, speed and time constants are author estimates."

[[pins]]
name = "gnd"
role = "ground"

[[pins]]
name = "v12"
role = "power"
reference = "gnd"

[[pins]]
name = "tach"
role = "output"
driver = "open_drain"
description = "Speed sense, needs a pull-up on the controller side"

[[pins]]
name = "pwm"
role = "input"
description = "PWM control, nominally 25 kHz; open = full speed"

[[parameters]]
name = "v_nominal"
type = "real"
unit = "V"
default = "12 V"
adjustable = false
description = "Supply voltage at which the CSV curves apply"

[[parameters]]
name = "v_pwm_pullup"
type = "real"
unit = "V"
default = "5 V"
min = 0
max = "5.25 V"
description = "Voltage of the internal pull-up on the PWM input (estimate)"

[[parameters]]
name = "r_pwm_pullup"
type = "real"
unit = "Ohm"
default = "10 kOhm"
min = "1 Ohm"
description = "Internal pull-up resistor of the PWM input (estimate)"

[[parameters]]
name = "v_pwm_threshold"
type = "real"
unit = "V"
default = "1.4 V"
min = 0
description = "PWM input logic threshold (estimate)"

[[parameters]]
name = "t_duty_filter"
type = "real"
unit = "s"
default = "2 ms"
min = "1 us"
description = "Time constant of the duty-cycle measurement"

[[parameters]]
name = "t_spinup"
type = "real"
unit = "s"
default = "1 s"
min = "1 ms"
description = "Time constant of the speed response (estimate)"

[[parameters]]
name = "i_inrush"
type = "real"
unit = "A"
default = "0.3 A"
min = 0
feature = "inrush"
description = "Extra current at standstill (estimate)"

[[parameters]]
name = "pulses_per_rev"
type = "integer"
unit = "1"
default = 2
min = 1
max = 8

[[parameters]]
name = "r_tach_on"
type = "real"
unit = "Ohm"
default = "100 Ohm"
min = "1 Ohm"
description = "On-resistance of the tach output (estimate)"

[[features]]
name = "inrush"
description = "Extra start-up current while the rotor accelerates"
default = true

[[curves]]
name = "current_vs_duty"
file = "data/generic_fan_4pin.csv"
x = "duty"
y = "current"
x_unit = "%"
y_unit = "A"
interpolation = "linear"
extrapolation = "clamp"

[[curves]]
name = "speed_vs_duty"
file = "data/generic_fan_4pin.csv"
x = "duty"
y = "speed"
x_unit = "%"
y_unit = "rpm"
interpolation = "linear"
extrapolation = "clamp"

[model]
kind = "load"
internal_nodes = ["npu"]

[[model.elements]]
name = "Vpullup"
type = "V"
nodes = ["npu", "gnd"]
params = { dc = "{v_pwm_pullup}" }

[[model.elements]]
name = "Rpullup"
type = "R"
nodes = ["npu", "pwm"]
params = { r = "{r_pwm_pullup}" }

[[model.signals]]
name = "supply_ratio"
expr = "limit(V(v12, gnd) / v_nominal, 0, 1.2)"
unit = "1"

[[model.signals]]
name = "duty"
expr = "V(pwm, gnd) > v_pwm_threshold ? 100 : 0"
tau = "{t_duty_filter}"
unit = "%"

[[model.signals]]
name = "speed_target"
expr = "speed_vs_duty(duty) * supply_ratio"
unit = "rpm"

[[model.signals]]
name = "speed"
expr = "speed_target"
tau = "{t_spinup}"
unit = "rpm"

[[model.branches]]
name = "motor"
nodes = ["v12", "gnd"]
mode = "formula"
expr = "current_vs_duty(duty) * supply_ratio"

[[model.branches]]
name = "start_up"
nodes = ["v12", "gnd"]
mode = "formula"
expr = "i_inrush * max(0, 1 - speed / max(speed_target, 1)) * supply_ratio"
feature = "inrush"

[[model.outputs]]
name = "tach_out"
source = "switch"
nodes = ["tach", "gnd"]
expr = "in_state(tach_low)"
ron = "{r_tach_on}"
roff = "1e9 Ohm"

[model.state_machine]
initial = "tach_high"
description = "Tachometer: toggles every 60 / (2 * pulses_per_rev * speed) seconds"

[[model.state_machine.states]]
name = "tach_high"

[[model.state_machine.states]]
name = "tach_low"

[[model.state_machine.transitions]]
from = "tach_high"
to = "tach_low"
after = "{60 / (2 * pulses_per_rev * max(speed, 1))}"

[[model.state_machine.transitions]]
from = "tach_low"
to = "tach_high"
after = "{60 / (2 * pulses_per_rev * max(speed, 1))}"

[[tests]]
name = "full_speed_pwm_open"
description = "PWM input open: duty 100 %, current from the CSV at 100 %"
analysis = "op"

[[tests.stimulus]]
name = "vsup"
nodes = ["v12", "gnd"]
source = "voltage"
waveform = "dc"
value = "12 V"

[[tests.stimulus]]
name = "vg"
nodes = ["gnd", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.expect]]
probe = "I(v12)"
value = "0.22 A"
rel_tol = 0.02

[[tests]]
name = "half_duty"
description = "25 kHz PWM with 50 % duty: current interpolated between 40 % and 60 %"
analysis = "tran"
stop = "50 ms"
step = "1 us"
features = { inrush = false }

[[tests.stimulus]]
name = "vsup"
nodes = ["v12", "gnd"]
source = "voltage"
waveform = "dc"
value = "12 V"

[[tests.stimulus]]
name = "vg"
nodes = ["gnd", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.stimulus]]
name = "vpwm"
nodes = ["pwm", "gnd"]
source = "voltage"
waveform = "pulse"
v1 = 0
v2 = "5 V"
delay = 0
rise = "100 ns"
fall = "100 ns"
width = "19.9 us"
period = "40 us"

[[tests.expect]]
probe = "I(v12)"
at = "40 ms"
value = "0.10 A"
abs_tol = "5 mA"

[[tests]]
name = "inrush"
description = "Supply switched on at 100 us; 1 ms later the rotor has barely moved"
analysis = "tran"
stop = "2 ms"
step = "1 us"

[[tests.stimulus]]
name = "vsup"
nodes = ["v12", "gnd"]
source = "voltage"
waveform = "pulse"
v1 = 0
v2 = "12 V"
delay = "100 us"
rise = "10 us"
fall = "10 us"
width = "1 s"
period = "2 s"

[[tests.stimulus]]
name = "vg"
nodes = ["gnd", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.expect]]
probe = "I(v12)"
at = "1.1 ms"
value = "0.52 A"
abs_tol = "10 mA"

[[tests]]
name = "tach_pulses"
description = "At 2000 rpm and 2 pulses per revolution the tach output toggles every 7.5 ms"
analysis = "tran"
stop = "20 ms"
step = "10 us"

[[tests.elements]]
name = "Rtach"
type = "R"
nodes = ["vlogic", "tach"]
params = { r = "10 kOhm" }

[[tests.stimulus]]
name = "vsup"
nodes = ["v12", "gnd"]
source = "voltage"
waveform = "dc"
value = "12 V"

[[tests.stimulus]]
name = "vg"
nodes = ["gnd", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.stimulus]]
name = "vlog"
nodes = ["vlogic", "0"]
source = "voltage"
waveform = "dc"
value = "5 V"

[[tests.expect]]
probe = "V(tach, gnd)"
at = "5 ms"
value = "5 V"
abs_tol = "10 mV"

[[tests.expect]]
probe = "V(tach, gnd)"
at = "10 ms"
value = "49.5 mV"
abs_tol = "2 mV"
description = "5 V * 100 Ohm / (10 kOhm + 100 Ohm)"
