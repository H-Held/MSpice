[[tests.expect]]
probe = "I(vdd)"
at = "30 us"
value = "1 mA"
rel_tol = 0.01
description = "Bits are still arriving; nothing latched yet"

[[tests.expect]]
probe = "I(vdd)"
at = "380 us"
value = "13 mA"
rel_tol = 0.01
description = "Last bit ends at 40 us; latch at 40 us + t_reset = 320 us"
