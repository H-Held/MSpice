[[tests.expect]]
probe = "V(dq, gnd)"
at = "520 us"
value = "5 V"
abs_tol = "50 mV"
description = "Reset released, presence pulse not yet started"

[[tests.expect]]
probe = "V(dq, gnd)"
at = "600 us"
value = "21 mV"
abs_tol = "10 mV"
description = "Presence pulse: 5 V * 20 Ohm / (4.7 kOhm + 20 Ohm)"

[[tests.expect]]
probe = "I(vdd)"
at = "1.5 ms"
value = "750 nA"
rel_tol = 0.01
description = "Command still being written"

[[tests.expect]]
probe = "I(vdd)"
at = "5 ms"
value = "1 mA"
rel_tol = 0.01
description = "Conversion running"
