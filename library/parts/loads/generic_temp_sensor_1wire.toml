source = "voltage"
waveform = "dc"
value = 0

[[tests.stimulus]]
name = "vctrl"
nodes = ["ctrl", "0"]
source = "voltage"
waveform = "pwl"
points = [
  [0, 0], [1e-05, 0], [1.01e-05, 5], [0.00051, 5],
