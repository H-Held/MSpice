format_version = "0.1"

[part]
id = "generic_valid_behavioral"
name = "Behavioral outputs"
version = "0.1.0"
category = "test/valid"
description = "Positive test fixture: Behavioral outputs."
author = "The MSpice Authors"
license = "CC-BY-4.0"
quality = "draft"

[part.source]
kind = "estimate"
title = "Validator test fixture"

[[pins]]
name = "p"
role = "analog"

[[pins]]
name = "n"
role = "analog"

[[parameters]]
name = "gain"
type = "real"
unit = "1"
default = 10

[model]
kind = "behavioral"
internal_nodes = ["x"]

[[model.signals]]
name = "level"
expr = "limit(gain * V(p, n), -5, 5)"
tau = "1 us"
unit = "V"

[[model.signals]]
name = "fast"
expr = "level * 2"

[[model.outputs]]
name = "vout"
source = "voltage"
nodes = ["x", "n"]
expr = "level"
r_out = "10 Ohm"

[[model.outputs]]
name = "iout"
source = "current"
nodes = ["p", "n"]
expr = "V(p, n) / 1meg + I(vout) * 0"

[[model.outputs]]
name = "sw"
source = "switch"
nodes = ["x", "n"]
expr = "fast > 1"
ron = "1 Ohm"
roff = "1 GOhm"

[[tests]]
name = "smoke"
analysis = "op"

[[tests.stimulus]]
name = "v1"
nodes = ["p", "n"]
source = "voltage"
waveform = "dc"
value = "1 V"

[[tests.stimulus]]
name = "vn"
nodes = ["n", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.expect]]
probe = "I(p)"
min = "-1 A"
max = "1 A"
