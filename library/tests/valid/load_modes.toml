# SPDX-License-Identifier: CC-BY-4.0
format_version = "0.1"

[part]
id = "generic_valid_load_modes"
name = "Load modes"
version = "0.1.0"
category = "test/valid"
description = "Positive test fixture: Load modes."
author = "The MSpice Authors"
license = "CC-BY-4.0"
quality = "draft"

[part.source]
kind = "estimate"
title = "Validator test fixture"

[[pins]]
name = "p"
role = "analog"

[[pins]]
name = "n"
role = "analog"

[[parameters]]
name = "p_load"
type = "real"
unit = "W"
default = "100 mW"

[[curves]]
name = "iv"
file = "data/iv.csv"
x = "voltage"
y = "current"
x_unit = "V"
y_unit = "A"

[model]
kind = "load"

[[model.branches]]
name = "constant_current"
nodes = ["p", "n"]
mode = "fixed"
value = "1 mA"

[[model.branches]]
name = "constant_resistance"
nodes = ["p", "n"]
mode = "fixed"
quantity = "resistance"
value = "10 kOhm"

[[model.branches]]
name = "constant_power"
nodes = ["p", "n"]
mode = "fixed"
quantity = "power"
value = "{p_load}"
v_min = "0.8 V"

[[model.branches]]
name = "table"
nodes = ["p", "n"]
mode = "curve"
curve = "iv"
input = "V(p, n)"

[[model.branches]]
name = "law"
nodes = ["p", "n"]
mode = "formula"
expr = "1e-3 * V(p, n)^2"

[[tests]]
name = "smoke"
analysis = "op"

[[tests.stimulus]]
name = "v1"
nodes = ["p", "n"]
source = "voltage"
waveform = "dc"
value = "1 V"

[[tests.stimulus]]
name = "vn"
nodes = ["n", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.expect]]
probe = "I(p)"
min = "-1 A"
max = "1 A"
