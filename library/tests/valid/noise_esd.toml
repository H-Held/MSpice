# SPDX-License-Identifier: CC-BY-4.0
format_version = "0.1"

[part]
id = "generic_valid_noise_esd"
name = "Noise esd"
version = "0.1.0"
category = "test/valid"
description = "Positive test fixture: Noise esd."
author = "The MSpice Authors"
license = "CC-BY-4.0"
quality = "draft"

[part.source]
kind = "estimate"
title = "Validator test fixture"

[[pins]]
name = "p"
role = "analog"

[[pins]]
name = "n"
role = "analog"


[model]
kind = "noise_source"

[model.noise]
type = "esd"
output = "voltage"
nodes = ["p", "n"]
peak = "2 kV"
rise_time = "1 ns"
decay_time = "60 ns"
delay = "1 us"
interval = "1 ms"
count = 3

[[tests]]
name = "bounded"
analysis = "tran"
stop = "1 ms"

[[tests.elements]]
name = "Rl"
type = "R"
nodes = ["p", "n"]
params = { r = "1 kOhm" }

[[tests.stimulus]]
name = "vn"
nodes = ["n", "0"]
source = "voltage"
waveform = "dc"
value = 0

[[tests.expect]]
probe = "V(p, n)"
min = "-3 kV"
max = "3 kV"
